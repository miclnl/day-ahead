[pytest]
# Run from the repository root: `python -m pytest`
# The add-on code imports both as "dao.prog.x" and as bare "x" (day_ahead.py
# does `from utils import ...`, check_db.py `from version import ...`), which
# is why the prog and lib directories are on the path as well.
testpaths = dao/tests
pythonpath = . dao dao/prog dao/lib
addopts = -p no:cacheprovider --basetemp=.pytest_tmp
filterwarnings =
    ignore::pytest.PytestCollectionWarning
