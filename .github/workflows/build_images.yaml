name: Build and publish

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to build"
        required: true
        type: string

  release:
    types: [published]

env:
  ARCHITECTURES: '["amd64", "aarch64"]'
  IMAGE_NAME: dao

permissions:
  contents: read

jobs:

  init:
    name: Initialize build
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      app_dir: ${{ steps.detect.outputs.app_dir }}
      version: ${{ steps.detect.outputs.version }}
      image_tags: ${{ steps.detect.outputs.image_tags }}

    steps:

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Detect release type
        id: detect
        shell: bash
        run: |
          DAO_VERSION=$(grep '^version:' dao/config.yaml | awk '{print $2}')
          TEST_VERSION=$(grep '^version:' release-testing/config.yaml | awk '{print $2}')
          PROG_VERSION=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' dao/prog/version.py)
          RELEASE_TAG="${{ github.event.release.tag_name }}"
          if [[ -z "$RELEASE_TAG" ]]; then
            RELEASE_TAG="${{ inputs.release_tag }}"
          fi

          echo "Release tag:     ${RELEASE_TAG}"
          echo "DAO version:     ${DAO_VERSION}"
          echo "Testing version: ${TEST_VERSION}"
          echo "version.py:      ${PROG_VERSION}"

          # Home Assistant vergelijkt add-on versies met awesomeversion. Een
          # streepje maakt van het nummer een SemVer prerelease, en die sorteert
          # voor de release zelf: 2026.9.29-2 geldt als ouder dan 2026.9.29,
          # waardoor de update nooit wordt aangeboden. Een dagrelease die opnieuw
          # moet, krijgt daarom een vierde component: 2026.9.29.1.
          check_version() {
            local file="$1" value="$2"

            if [[ -z "${value}" ]]; then
              echo "ERROR: geen versie gevonden in ${file}"
              exit 1
            fi

            if [[ "${value}" == *-* ]]; then
              echo "ERROR: ${file} heeft versie '${value}' met een streepje."
              echo "  Home Assistant leest dat als een SemVer prerelease en ziet de"
              echo "  release dan als ouder dan hetzelfde nummer zonder streepje,"
              echo "  dus wordt de update niet aangeboden."
              echo "  Gebruik JAAR.MAAND.DAG.PATCH, bijvoorbeeld ${value%%-*}.1"
              exit 1
            fi
          }

          check_version "dao/config.yaml" "${DAO_VERSION}"
          check_version "release-testing/config.yaml" "${TEST_VERSION}"
          check_version "dao/prog/version.py" "${PROG_VERSION}"

          if [[ "${PROG_VERSION}" != "${DAO_VERSION}" ]]; then
            echo "ERROR: dao/prog/version.py (${PROG_VERSION}) loopt niet gelijk met"
            echo "  dao/config.yaml (${DAO_VERSION}). Bump ze samen."
            exit 1
          fi

          if [[ "${RELEASE_TAG}" == "${DAO_VERSION}" ]]; then
            echo "Detected stable release"

            echo "app_dir=dao" >> "$GITHUB_OUTPUT"
            echo "version=${DAO_VERSION}" >> "$GITHUB_OUTPUT"

            {
              echo "image_tags<<EOF"
              echo "${DAO_VERSION}"
              echo "stable"
              echo "latest"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"

          elif [[ "${RELEASE_TAG}" == "${TEST_VERSION}" ]]; then
            echo "Detected testing release"

            echo "app_dir=release-testing" >> "$GITHUB_OUTPUT"
            echo "version=${TEST_VERSION}" >> "$GITHUB_OUTPUT"

            {
              echo "image_tags<<EOF"
              echo "${TEST_VERSION}"
              echo "testing"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"

          else
            echo "ERROR: release tag '${RELEASE_TAG}' does not match:"
            echo "  dao/config.yaml: ${DAO_VERSION}"
            echo "  release-testing/config.yaml: ${TEST_VERSION}"
            exit 1
          fi

      - name: Prepare multi-architecture matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.06.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}


  build:
    name: Build ${{ matrix.arch }} image
    needs: init

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.matrix) }}

    permissions:
      contents: read
      id-token: write
      packages: write

    steps:

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Prepare testing build context
        if: needs.init.outputs.app_dir == 'release-testing'
        run: |
          cp -a dao/* release-testing/

      - name: Build and publish image
        uses: home-assistant/builder/actions/build-image@2026.06.0
        with:
          arch: ${{ matrix.arch }}

          image: ${{ matrix.image }}

          context: ${{ needs.init.outputs.app_dir }}

          container-registry: ghcr.io
          container-registry-username: ${{ github.repository_owner }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}

          image-tags: ${{ needs.init.outputs.image_tags }}

          version: ${{ needs.init.outputs.version }}

          push: "true"

          cache-gha: "true"
          cache-gha-scope: ${{ needs.init.outputs.app_dir }}


  manifest:
    name: Publish multi-architecture manifest
    needs:
      - init
      - build

    runs-on: ubuntu-latest

    permissions:
      id-token: write
      packages: write

    steps:

      - name: Publish multi-architecture manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.06.0
        with:
          architectures: ${{ env.ARCHITECTURES }}

          image-name: ${{ env.IMAGE_NAME }}

          container-registry: ghcr.io
          container-registry-username: ${{ github.repository_owner }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}

          image-tags: ${{ needs.init.outputs.image_tags }}